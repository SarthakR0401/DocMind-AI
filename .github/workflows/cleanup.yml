name: Cleanup Old Deployments

on:
  push:
  deployment_status:

permissions:
  deployments: write
  contents: read

jobs:
  cleanup:
    if: github.event_name == 'push' || (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Delete Old Deployments
        uses: actions/github-script@v6
        with:
          script: |
            const { owner, repo } = context.repo;
            
            // 1. Get ALL deployments (paginate to ensure we see every single one)
            const deployments = await github.paginate(github.rest.repos.listDeployments, {
              owner,
              repo,
            });
            
            console.log(`Analyzing ${deployments.length} deployments...`);
            
            if (deployments.length <= 1) {
              console.log("Only 1 deployment found. Nothing to clean.");
              return;
            }

            // 2. Sort by ID descending (Newest first)
            deployments.sort((a, b) => b.id - a.id);
            
            // 3. Keep the newest one, delete EVERYTHING else
            const newest = deployments[0];
            const toDelete = deployments.slice(1);
            
            console.log(`Success! Keeping newest deployment: ${newest.id} (${newest.environment})`);
            console.log(`Starting wipe of ${toDelete.length} old deployments...`);
            
            for (const dep of toDelete) {
              try {
                // To delete a deployment, the API often requires it to be inactive first
                await github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: dep.id,
                  state: 'inactive'
                });

                await github.rest.repos.deleteDeployment({
                  owner,
                  repo,
                  deployment_id: dep.id,
                });
                console.log(`✅ Deleted: ${dep.id} [${dep.environment}]`);
              } catch (e) {
                console.log(`❌ Skipped: ${dep.id} - ${e.message}`);
              }
            }
